[project]
name = "vat-client"
version = "0.1.0"
description = "VAT client — receives PRISM point cloud deltas and renders them in Rerun"
# Standalone, isolated uv project: own client/.venv + client/uv.lock.
#   cd client && uv sync && uv run python prism_rerun_viewer.py
# The bring-up tools in ../tools run in this same env.
# Capped <3.13: Open3D (the POC viewer) only ships wheels for cp310–cp312.
# uv will auto-provision a compatible interpreter for client/.venv.
requires-python = ">=3.10,<3.13"
dependencies = [
    # Transport
    "eclipse-zenoh>=1.0",
    # Visualization — VisPy is the POC viewer: native OpenGL point scatter, no
    # shaders to write, handles 10^5–10^6 points at 60fps. glfw is the lightweight
    # windowing backend (if it ever misbehaves, `uv pip install pyqt5` — VisPy auto-
    # detects it). rerun-sdk kept only for the legacy viewer (make viewer-rerun).
    "vispy>=0.14",
    "glfw>=2.6",
    # Draco point-cloud compression for the block-sync bundle (client decodes)
    "DracoPy>=1.4",
    "rerun-sdk>=0.21",
    # Numerics
    "numpy>=1.24",
    # (future) scipy for trajectory smoothing
    "scipy>=1.12",
    # Bring-up tools (tools/): CDR decode + JPEG decode for the diagnostic viewers
    "rosbags>=0.10",
    "opencv-python>=4.9",
    # Remote periscope video decode. The robot defaults to PERISCOPE_CODEC=h265
    # (see vat.env), so the viewer NEEDS PyAV to decode the H.265/H.264 slice --
    # without it, frames arrive but 0 decode and only the aim frustum draws (the
    # video panel is gated on a decoded frame). cv2 alone only covers the MJPEG
    # fallback. PyAV bundles ffmpeg with software HEVC/H.264 DECODERS (no GPU/NVENC
    # needed on the client -- decode is CPU-side).
    "av>=11.0",
    # Optional: URDF mesh avatar (GO2_URDF + press 'U'). Guarded imports — the
    # viewer falls back to the wireframe skeleton if these aren't installed.
    "yourdfpy>=0.0.56",
    "trimesh>=4.0",
    "pycollada>=0.8",   # trimesh loads the .dae meshes via this
    "fast-simplification>=0.1",   # decimate the avatar meshes at load (far-view low-poly)
]

[tool.uv]
# Virtual project: install deps into client/.venv, run the viewer/tools as
# scripts (no build of the client module itself).
package = false
