[project]
name = "vat-client"
version = "0.1.0"
description = "VAT client — receives PRISM point cloud deltas and renders them in Rerun"
requires-python = ">=3.10"
dependencies = [
    # Transport
    "eclipse-zenoh>=1.0",
    # Visualization
    "rerun-sdk>=0.21",
    # Numerics
    "numpy>=1.24",
    # (future) scipy for trajectory smoothing
    "scipy>=1.12",
    # Bring-up tools (tools/): CDR decode + JPEG decode for the diagnostic viewers
    "rosbags>=0.10",
    "opencv-python-headless>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client"]
