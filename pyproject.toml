[project]
name = "vat"
version = "0.1.0"
description = "Volumetric Asynchronous Teleoperation — monorepo workspace root"
requires-python = "==3.12.*"
# The root is virtual: it carries no runtime deps of its own.
# All actual packages live in server/ and client/.
dependencies = []

[tool.uv]
# The root workspace covers the lightweight client (+ the bring-up tools that
# run in the client env).  Sync it with:  uv sync --package vat-client
package = false

[tool.uv.workspace]
# Each server/ microservice is its OWN isolated uv project (own .venv, own
# lockfile) so the heavy CUDA/torch stack of the mapper and the single light dep
# of the router never clash with each other or with the client.  Sync them on
# their own:
#     cd server/mapping && uv sync      # mapping server (GPU machine)
#     cd server/router  && uv sync      # Zenoh router
members = ["client"]
exclude = ["server/mapping", "server/router"]

# ── Documentation dev-deps (shared across the workspace) ──────────────────────
[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-macros-plugin>=1.5",
    "Pygments==2.20.0",
]
