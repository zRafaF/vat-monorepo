[project]
name = "vat"
version = "0.1.0"
description = "Volumetric Asynchronous Teleoperation — monorepo root (docs only)"
requires-python = ">=3.10"
# This root project is NOT a workspace. Each runtime service is its own isolated
# uv project, with its own .venv and uv.lock inside its folder, so you can run
# several on one machine without a shared lockfile being rewritten:
#     cd client         && uv sync      # client viewer + bring-up tools
#     cd server/mapping && uv sync      # mapping server (GPU machine)
#     cd server/router  && uv sync      # Zenoh router
# The root keeps ONLY the documentation tooling (its own root .venv, touched only
# by `make docs`).
dependencies = []

[tool.uv]
package = false

# ── Documentation dev-deps (root-only; build with `make docs`) ────────────────
[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-material-extensions>=1.3",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-macros-plugin>=1.5",
    "Pygments==2.20.0",
]
