[project]
name = "vat-mapping"
version = "0.1.0"
description = "VAT mapping server — runs the PRISM-VGGT pipeline and streams point cloud deltas + pose corrections"
requires-python = ">=3.10"
dependencies = [
    # Transport
    "eclipse-zenoh>=1.0",
    # Serialization — CDR (no protobuf needed)
    "rosbags>=0.10",
    # PRISM-VGGT library (local submodule — installed editable, see tool.uv.sources)
    "prism-vggt",
    # Image decoding (JPEG → numpy)
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    # 3D / point cloud helpers
    "open3d>=0.18",
    # NOTE: torch + nvblox_torch are pulled in transitively by prism-vggt.
    # To force a CUDA build, pin torch here and add the pytorch index below.
]

# ── PRISM-VGGT as a local editable path dep ───────────────────────────────────
# The submodule now lives at server/mapping/PRISM-VGGT.  After cloning:
#   git submodule update --init server/mapping/PRISM-VGGT
[tool.uv.sources]
prism-vggt = { path = "PRISM-VGGT", editable = true }

# ── PyTorch CUDA index (uncomment + adjust for your CUDA version) ─────────────
# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu121" }
# torchvision = { index = "pytorch-cu121" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-module application — ship just the server script.
[tool.hatch.build.targets.wheel]
only-include = ["mapping_server.py"]
