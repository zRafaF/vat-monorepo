services:
  vat-bridge:
    build:
      context: ..          # repo root (so we can COPY ../frame_decimator.py)
      dockerfile: bridge_node/Dockerfile
    restart: unless-stopped
    network_mode: host     # needed for ROS2 DDS discovery (multicast)
    environment:
      ROBOT_NAME:    "${ROBOT_NAME:-go2}"
      ZENOH_CONNECT: "${ZENOH_CONNECT:-tcp/127.0.0.1:7447}"
      LOG_LEVEL:     "${LOG_LEVEL:-INFO}"
      # Frame decimator config (also live-tunable via Zenoh)
      THROTTLE_FPS:  "${THROTTLE_FPS:-3.0}"
      WINDOW_SIZE:   "${WINDOW_SIZE:-5}"
      JPEG_QUALITY:  "${JPEG_QUALITY:-85}"
      CAMERA_FPS:    "${CAMERA_FPS:-30.0}"
    # ROS2 DDS on the host requires the container to share IPC namespaces on some setups
    ipc: host
    # Persist logs across restarts
    logging:
      driver: journald
      options:
        tag: "vat-bridge"
